name: Publish SDK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version already committed to main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-sdk
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e 'if (require("./package.json").version !== process.env.RELEASE_VERSION) process.exit(1)'
      - run: npm ci
      - run: npm run type:check
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
